services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: wm_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  registry:
    build: .
    container_name: wm_registry
    command: python WM_Registry/WM_Registry.py 5500 --db /data/registry.db --cert /data/certs/registry_cert.pem --key /data/certs/registry_key.pem
    environment:
      # Nombres/IP adicionales del certificado HTTPS (p. ej. la IP pública con la que conectan las WS)
      WM_REGISTRY_SAN: ${WM_REGISTRY_SAN:-}
    ports:
      - "5500:5500"
    volumes:
      - ./data:/data

  central:
    build: .
    container_name: wm_central
    command: python WM_Central/WM_Central.py 5000 kafka:19092 --web-port 8080 --db /data/central.db
    depends_on:
      - kafka
      - registry
    ports:
      - "5000:5000"
      - "8080:8080"
    environment:
      DB_PATH: /data/central.db
      KAFKA_BOOTSTRAP: kafka:19092
      WM_REGISTRY_URL: https://registry:5500
      WM_REGISTRY_DB: /data/registry.db
      WM_REGISTRY_CA: /data/certs/registry_cert.pem
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true

  front:
    image: node:20-alpine
    container_name: wm_front
    working_dir: /app
    volumes:
      - ./front:/app
    command: node server.js 3000 http://central:8080
    depends_on:
      - central
    ports:
      - "3000:3000"
